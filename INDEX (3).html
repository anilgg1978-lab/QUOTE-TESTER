<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuoteBuilder - Quick Extraction Tester</title>
<style>
    :root { --accent:#0071e3; --bg:#f5f5f7; --card:#fff; --border:#e8e8ed; --text:#1d1d1f; --muted:#86868b; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); margin:0; padding: 40px 20px; }
    .container { max-width: 780px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
    p.subtitle { color: var(--muted); margin-top: 0; font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04); }
    label { display:block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    input[type=password], input[type=text], input[type=file] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; margin-bottom: 16px; }
    button { background: var(--accent); color: #fff; border: none; padding: 11px 22px; border-radius: 980px; font-size: 14px; font-weight: 500; cursor: pointer; }
    button:disabled { background: #c7c7cc; cursor: not-allowed; }
    .status { font-size: 13.5px; color: var(--muted); margin-top: 10px; }
    .status.error { color: #c53929; }
    pre { background: #f5f5f7; border-radius: 10px; padding: 16px; font-size: 12.5px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    .field-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .field-row:last-child { border-bottom: none; }
    .field-row .label { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .missing { background: #fff2f0; border: 1px solid #f6cec7; border-radius: 10px; padding: 14px; color: #c53929; font-size: 13px; margin-top: 14px; }
    .missing ul { margin: 6px 0 0 18px; padding: 0; }
</style>
</head>
<body>
<div class="container">
    <h1>Quick Extraction Tester</h1>
    <p class="subtitle">Standalone, no deployment needed. Your API key stays in this browser only -- it's sent directly to Google, never to any other server.</p>

    <div class="card">
        <label>Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="Paste your Gemini API key">
        <label>Engineering Drawing (PDF)</label>
        <input type="file" id="fileInput" accept="application/pdf">
        <button id="extractBtn">Extract</button>
        <div class="status" id="status"></div>
    </div>

    <div class="card" id="resultCard" style="display:none;">
        <div id="resultSummary"></div>
    </div>

    <div class="card" id="rawCard" style="display:none;">
        <label>Raw JSON (for debugging)</label>
        <pre id="rawJson"></pre>
    </div>
</div>

<script>
const MODEL = "gemini-3.7-flash";

const SYSTEM_PROMPT = `You are an expert Manufacturing Engineer and CNC Process Planner reading a real engineering drawing.
Extract ONLY what is actually printed or clearly shown on the drawing. Do not invent material, quantity, dimensions, tolerances, rates, or costs.
If something is not available on the drawing, return null where appropriate and add a clear explanation to "missing_info".
Return ONLY valid JSON. Do not return markdown. Do not add any explanation before or after the JSON.

Use exactly this structure:
{
  "drawing_no": string or null,
  "part_name": string or null,
  "revision": string or null,
  "material": string or null,
  "quantity": number or null,
  "features": [
    { "feature": string, "operation": string, "machine_category": string, "est_hours": number or null, "confidence": "high" | "inferred" | "unclear" | "missing" }
  ],
  "special_processes": [
    { "process": string, "requirement": string, "confidence": "high" | "inferred" | "unclear" | "missing" }
  ],
  "missing_info": [string],
  "raw_notes": string
}

For every feature where confidence is "high" or "inferred", provide a numeric est_hours estimate (rough industry-standard benchmark, not a shop quote) -- only use null when confidence is "unclear" or "missing".
Valid machine_category values: CNC_LATHE, VMC, HMC, GRINDING, MANUAL_BENCH, DEEP_HOLE_DRILL.`;

const apiKeyInput = document.getElementById('apiKey');
const fileInput = document.getElementById('fileInput');
const extractBtn = document.getElementById('extractBtn');
const statusEl = document.getElementById('status');
const resultCard = document.getElementById('resultCard');
const resultSummary = document.getElementById('resultSummary');
const rawCard = document.getElementById('rawCard');
const rawJson = document.getElementById('rawJson');

// Remember the key locally between visits so you don't have to paste it every time.
const savedKey = localStorage.getItem('quotebuilder_test_api_key');
if (savedKey) apiKeyInput.value = savedKey;
apiKeyInput.addEventListener('change', () => {
    localStorage.setItem('quotebuilder_test_api_key', apiKeyInput.value);
});

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (isError ? ' error' : '');
}

function renderResult(data) {
    resultCard.style.display = 'block';
    let html = '';
    html += `<div class="field-row"><span class="label">Drawing No.</span><span>${data.drawing_no || '-'}</span></div>`;
    html += `<div class="field-row"><span class="label">Part Name</span><span>${data.part_name || '-'}</span></div>`;
    html += `<div class="field-row"><span class="label">Revision</span><span>${data.revision || '-'}</span></div>`;
    html += `<div class="field-row"><span class="label">Material</span><span>${data.material || 'MISSING / NOT AVAILABLE'}</span></div>`;
    html += `<div class="field-row"><span class="label">Quantity</span><span>${data.quantity || 'MISSING / NOT AVAILABLE'}</span></div>`;

    if (data.features && data.features.length) {
        html += '<table><tr><th>Feature</th><th>Operation</th><th>Machine</th><th>Hrs</th><th>Confidence</th></tr>';
        for (const f of data.features) {
            html += `<tr><td>${f.feature}</td><td>${f.operation}</td><td>${f.machine_category}</td><td>${f.est_hours ?? '-'}</td><td>${f.confidence}</td></tr>`;
        }
        html += '</table>';
    }

    if (data.special_processes && data.special_processes.length) {
        html += '<table><tr><th>Process</th><th>Requirement</th><th>Confidence</th></tr>';
        for (const p of data.special_processes) {
            html += `<tr><td>${p.process}</td><td>${p.requirement}</td><td>${p.confidence}</td></tr>`;
        }
        html += '</table>';
    }

    if (data.missing_info && data.missing_info.length) {
        html += '<div class="missing"><strong>Missing / not available:</strong><ul>';
        for (const m of data.missing_info) html += `<li>${m}</li>`;
        html += '</ul></div>';
    }

    resultSummary.innerHTML = html;
}

extractBtn.addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim();
    const file = fileInput.files[0];

    if (!apiKey) { setStatus('Enter your Gemini API key first.', true); return; }
    if (!file) { setStatus('Choose a PDF file first.', true); return; }

    extractBtn.disabled = true;
    setStatus('Reading drawing... this can take 20-60 seconds.');
    resultCard.style.display = 'none';
    rawCard.style.display = 'none';

    try {
        const base64 = await fileToBase64(file);

        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
                    contents: [{
                        parts: [
                            { inline_data: { mime_type: 'application/pdf', data: base64 } },
                            { text: 'Analyze this engineering drawing. Return ONLY the requested JSON object.' }
                        ]
                    }],
                    generationConfig: { response_mime_type: 'application/json' }
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error?.message || `HTTP ${response.status}`);
        }

        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error('No response text from Gemini -- check the raw JSON below.');

        const parsed = JSON.parse(text);
        renderResult(parsed);
        rawJson.textContent = JSON.stringify(parsed, null, 2);
        rawCard.style.display = 'block';
        setStatus('Done.');
    } catch (err) {
        setStatus('Error: ' + err.message, true);
    } finally {
        extractBtn.disabled = false;
    }
});
</script>
</body>
</html>
